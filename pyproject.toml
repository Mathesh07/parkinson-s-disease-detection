[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parkinson-reliability"
version = "1.0.0"
description = "Tri-Modal Parkinson's Disease Detection System with Evidential Deep Learning and Cross-Modal Reliability Fusion"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Mathesh" }
]
keywords = [
    "parkinsons-disease",
    "evidential-deep-learning",
    "uncertainty-quantification",
    "multimodal-fusion",
    "conformal-prediction",
    "deep-ensemble"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "safetensors>=0.4.0",
    "Pillow>=9.5.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "Gait/tests", "Voice/tests", "Handwriting/tests", "demo/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
